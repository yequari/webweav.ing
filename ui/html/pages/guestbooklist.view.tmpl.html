{{ define "title" }} Guestbooks  {{ end }}
{{ define "main" }}
<h1>Guestbooks run by {{ .User.Username }}</h1>
<ul>
    {{ range .Guestbooks }}
    <li><a href="/guestbooks/{{ shortIdToSlug .ShortId }}">{{ with .SiteUrl }}{{ . }}{{ else }}Untitled{{ end }}</a></li>
    {{ else }}
    <p>No Guestbooks yet</p>
    {{ end }}
</ul>
{{ end }}
